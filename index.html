<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔍 Tìm kiếm sản phẩm - TPK</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔍 Tìm Kiếm Sản Phẩm</h1>
      <p class="subtitle">Tra cứu nhanh mã hàng & báo giá chính xác</p>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput"
             placeholder="Hãy nhập hàng hóa bạn cần tìm (VD: mh s21, pin vivo, ip14pm, samsung a15...)"
             autocomplete="off">
      <button id="clearBtn" class="clear-btn" title="Xóa">✕</button>
    </div>

    <div class="filters">
      <div class="category-filters">
        <label class="radio-pill"><input type="radio" name="category" value="all" checked><span>Tất cả</span></label>
        <label class="radio-pill"><input type="radio" name="category" value="manhinh"><span>Màn hình</span></label>
        <label class="radio-pill"><input type="radio" name="category" value="pin"><span>Pin</span></label>
        <label class="radio-pill"><input type="radio" name="category" value="matlung"><span>Mặt lưng</span></label>
        <label class="radio-pill"><input type="radio" name="category" value="bosac"><span>Bo sạc - Cụm sạc - Chân sạc</span></label>
        <label class="radio-pill"><input type="radio" name="category" value="caploa"><span>Cáp loa - Loa trong ngoài</span></label>
        <label class="radio-pill"><input type="radio" name="category" value="khac"><span>Khác</span></label>
      </div>

      <div class="view-toggle">
        <button id="viewTable" class="view-btn active">📋 Bảng</button>
        <button id="viewGrid" class="view-btn">▦ Lưới</button>
      </div>
    </div>

    <div class="status-bar">
      <span id="resultCount">Đang tải dữ liệu...</span>
      <span id="loadingInfo"></span>
    </div>

    <div id="results"></div>
  </div>

  <script src="app.js"></script>
   <!-- Tự Động Chat -->
  <script src="https://app.tudongchat.com/js/chatbox.js"></script>
  <script>
    const tudong_chatbox = new TuDongChat('hTiPuZhyd688YX9_ZFEP-');
    tudong_chatbox.initial();
  </script>
  <script>
    // ==UserScript==
// @name         Đổi link Facebook - Tú Động Chat
// @namespace    http://tampermonkey.net/
// @version      1.0
// @description  Tự động đổi link icon Facebook trong widget chat
// @match        *://*/*
// @run-at       document-idle
// @grant        none
// ==/UserScript==

(function () {
    'use strict';

    const FB_URL = 'https://www.facebook.com/truong.a.hao.2024/';
    const ZALO_URL = 'https://zalo.me/0706883622';      // nếu muốn đổi Zalo thì điền vào
    const PHONE_URL = 'tel:0706883622';     // nếu muốn đổi Hotline thì điền vào

    function updateLinks() {
        // Facebook icon: <img alt="Facebook logo">
        document.querySelectorAll('img[alt="Facebook logo"]').forEach(img => {
            const a = img.closest('a.tdc-clicker');
            if (a && a.href !== FB_URL) {
                a.href = FB_URL;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                console.log('✅ Đã đổi link Facebook');
            }
        });

        // Zalo icon
        document.querySelectorAll('img[alt="Zalo logo"]').forEach(img => {
            if (ZALO_URL === '#') return;
            const a = img.closest('a.tdc-clicker');
            if (a && a.href !== ZALO_URL) a.href = ZALO_URL;
        });

        // Phone icon
        document.querySelectorAll('img[alt="Phone Icon"]').forEach(img => {
            if (PHONE_URL === '#') return;
            const a = img.closest('a.tdc-clicker');
            if (a && a.href !== PHONE_URL) a.href = PHONE_URL;
        });
    }

    // Chạy ngay
    updateLinks();

    // Widget load động -> theo dõi DOM
    const observer = new MutationObserver(updateLinks);
    observer.observe(document.documentElement, {
        childList: true,
        subtree: true
    });
})();

//--
(function() {
    const FB_URL = 'https://www.facebook.com/truong.a.hao.2024/';
    
    // Tìm tất cả SVG có viewBox của icon Facebook
    const svgs = document.querySelectorAll('svg[viewBox="0 0 256 256"]');
    
    svgs.forEach(svg => {
        // Kiểm tra có path fill màu xanh Facebook (#1877f2) không
        const fbPath = svg.querySelector('path[fill="#1877f2"]');
        if (fbPath) {
            // Lấy thẻ <a> gần nhất trong container
            const container = svg.closest('div.m-1.p-2.flex.cursor-pointer');
            const link = container?.querySelector('a');
            
            if (link) {
                link.href = FB_URL;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                console.log('✅ Đã gắn link:', FB_URL);
            }
        }
    });
})();
  </script>
</body>
</html>
